# version: "3.8"  the attribute `version` is obsolete, it will be ignored
services:
    api:
        container_name: ip-management-service-api
        build:
            context: .
            dockerfile: ./docker/local/Dockerfile
            target: php
            args:
                - APP_ENV=local
        environment:
            - APP_ENV=local
        working_dir: /var/www
        volumes:
            - ./site:/var/www
            - ./site/storage:/var/www/storage
        networks:
            - api_network
        depends_on:
            - database
    database:
        container_name: ip-management-service-database
        image: mysql:8.0
        ports:
            - 3309:3306
        environment:
            - MYSQL_DATABASE=ip_management_service
            - MYSQL_USER=ip_management_service_user
            - MYSQL_PASSWORD=secret
            - MYSQL_ROOT_PASSWORD=secret
        volumes:
            - db-data:/var/lib/mysql
        networks:
            - api_network

    nginx:
        image: nginx:alpine
        container_name: ip-management-service-nginx
        volumes:
            - ./docker/local/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./docker/local/nginx/mkcert:/etc/nginx/mkcert
            - ./site:/var/www
        ports:
            - "80:80"
            - "443:443"
            - "8444:443"
        networks:
            - api_network
        depends_on:
            - api
volumes:
    db-data: ~

networks:
    api_network:
        driver: bridge
